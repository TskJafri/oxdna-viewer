<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>oxView – 2D Helix Sandbox</title>
    <link rel="stylesheet" href="./editor.css">
</head>
<body>
<div class="panes" id="panes" style="height:100vh;">
    <div class="editor-pane" id="editor-pane">
        <div class="editor-toolbar">
            <span class="pane-title">2D Helix Layout Sandbox</span>
            <button class="btn" id="btn-clear">Clear</button>
            <button class="btn" id="btn-fit">Fit</button>
            <button class="btn" id="btn-example">Example</button>
            <button class="btn" id="btn-load-helixpos">Load HelixPos</button>
            <div class="spacer"></div>
            <span class="node-count">Nodes: <span id="node-count-val">0</span></span>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="editor-canvas"></canvas>
            <div id="cell-tooltip"></div>
        </div>
    </div>

    <div class="divider" id="divider" title="Drag to resize panes"></div>

    <div class="oxview-pane" id="oxview-pane">
        <div class="oxview-toolbar">
            <span class="pane-title">3D Pane Placeholder</span>
        </div>
        <div class="oxview-body">
            <div class="oxview-placeholder" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;">
                <div>
                    <h2 style="margin-bottom:8px;">Reserved for oxView canvas</h2>
                    <p style="color:var(--text-dim);">This pane stays empty in the sandbox page. The goal is validating side-by-side layout and 2D helix positioning logic.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../ts/lib/three.js"></script>
<script src="../dist/helix/scadnano.js"></script>
<script>
(function () {
    'use strict';

    if (typeof THREE === 'undefined') {
        document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif;">THREE.js not found. Run this from the project root with a local server.</div>';
        return;
    }
    if (typeof scadnano === 'undefined' || typeof scadnano.HoneycombEditor === 'undefined') {
        document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif;">dist/helix/scadnano.js not found. Run tsc first.</div>';
        return;
    }

    const canvas = document.getElementById('editor-canvas');
    const wrap = document.getElementById('canvas-wrap');
    const count = document.getElementById('node-count-val');

    function resizeCanvas() {
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
    }
    resizeCanvas();

    const editor = new scadnano.HoneycombEditor(canvas);

    function refreshCount() {
        count.textContent = String(editor.getNodes().length);
    }

    editor.onNodesChanged = refreshCount;
    refreshCount();

    document.getElementById('btn-clear').addEventListener('click', () => editor.setNodes([]));
    document.getElementById('btn-fit').addEventListener('click', () => editor.fitView());
    document.getElementById('btn-example').addEventListener('click', () => {
        editor.setNodes([
            { id: 0, col: -1, row: -1, label: '-1,-1' },
            { id: 1, col: 0, row: 0, label: '0,0' },
            { id: 2, col: 1, row: 1, label: '1,1' },
            { id: 3, col: 2, row: 2, label: '2,2' },
            { id: 4, col: 3, row: 3, label: '3,3' },
            { id: 5, col: 4, row: 4, label: '4,4' }
        ]);
        editor.fitView();
    });

    function normalizeHelixPos(input) {
        if (!input) return null;

        if (input instanceof Map) {
            const mapFromMap = new Map();
            input.forEach((value, key) => {
                if (!Array.isArray(value) || value.length < 2) return;
                const helixId = Number(key);
                const col = Number(value[0]);
                const row = Number(value[1]);
                if (Number.isFinite(helixId) && Number.isFinite(col) && Number.isFinite(row)) {
                    mapFromMap.set(helixId, [col, row]);
                }
            });
            return mapFromMap;
        }

        if (Array.isArray(input)) {
            const mapFromPairs = new Map();
            input.forEach((entry) => {
                if (!Array.isArray(entry) || entry.length < 2) return;
                const helixId = Number(entry[0]);
                const value = entry[1];
                if (!Array.isArray(value) || value.length < 2) return;
                const col = Number(value[0]);
                const row = Number(value[1]);
                if (Number.isFinite(helixId) && Number.isFinite(col) && Number.isFinite(row)) {
                    mapFromPairs.set(helixId, [col, row]);
                }
            });
            return mapFromPairs;
        }

        if (typeof input === 'object') {
            const mapFromObject = new Map();
            Object.keys(input).forEach((k) => {
                const value = input[k];
                if (!Array.isArray(value) || value.length < 2) return;
                const helixId = Number(k);
                const col = Number(value[0]);
                const row = Number(value[1]);
                if (Number.isFinite(helixId) && Number.isFinite(col) && Number.isFinite(row)) {
                    mapFromObject.set(helixId, [col, row]);
                }
            });
            return mapFromObject;
        }

        return null;
    }

    function parseRawHelixPosText(raw) {
        const text = String(raw || '').trim();
        if (!text) return null;

        try {
            return JSON.parse(text);
        } catch (_jsonErr) {
            // Accept pasted JS expressions such as: new Map([[0,[0,0]],[1,[1,0]]])
            try {
                return Function('return (' + text + ');')();
            } catch (_jsErr) {
                return null;
            }
        }
    }

    function loadHelixPos(input) {
        const map = normalizeHelixPos(input);
        if (!map || map.size === 0) {
            alert('No valid HelixPos data found. Provide a Map<number,[col,row]> or object like {"0":[0,0],"1":[1,0]}.');
            return;
        }
        editor.loadFromHelixPos(map);
    }

    document.getElementById('btn-load-helixpos').addEventListener('click', () => {
        if (window.helixPositions) {
            loadHelixPos(window.helixPositions);
            return;
        }

        if (window.lastHelixPos) {
            loadHelixPos(window.lastHelixPos);
            return;
        }

        const raw = prompt('Paste HelixPos (Map literal, JSON object, or pair array). Example: new Map([[0,[0,0]],[1,[1,0]]])');
        if (!raw) return;

        const parsed = parseRawHelixPosText(raw);
        if (!parsed) {
            alert('Could not parse HelixPos text.');
            return;
        }
        loadHelixPos(parsed);
    });

    window.loadHelixPosToSandbox = function (helixPos) {
        loadHelixPos(helixPos);
    };

    window.addEventListener('resize', resizeCanvas);

    const panes = document.getElementById('panes');
    const editorPane = document.getElementById('editor-pane');
    const divider = document.getElementById('divider');
    let dragging = false;

    divider.addEventListener('mousedown', (e) => {
        dragging = true;
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const rect = panes.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const clamped = Math.max(0.2, Math.min(0.8, ratio));
        editorPane.style.flex = '0 0 ' + (clamped * 100) + '%';
        resizeCanvas();
    });

    window.addEventListener('mouseup', () => {
        dragging = false;
    });
})();
</script>
</body>
</html>
